name: Build Nightfall Courtyard APK
on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap with Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Nightfall Courtyard" "com.drgroup.nightfall" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Lock Landscape Orientation
        run: |
          sed -i 's/android:exported="true"/android:exported="true" android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Courtyard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
