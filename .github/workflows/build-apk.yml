name: Build Nightfall Courtyard APK
on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap with Capacitor Android & Generate App Icon
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.drgroup.nightfall",
            "appName": "Nightfall Courtyard",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          python3 -m pip install --break-system-packages -q pillow || pip install -q pillow
          python3 -c '
          from PIL import Image
          icon = Image.open("assets/icon.png").convert("RGBA").resize((1024, 1024), Image.LANCZOS)
          icon.save("assets/icon.png")
          splash = Image.new("RGBA", (2732, 2732), (9, 10, 15, 255))
          splash.paste(icon, (854, 854), icon)
          splash.save("assets/splash.png")
          '
          npx capacitor-assets generate --android --iconBackgroundColor '#090A0F' --splashBackgroundColor '#090A0F'

      - name: Fix Kotlin Duplicate Class & Lock Portrait Orientation
        run: |
          sed -i 's/android:exported="true"/android:exported="true" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Courtyard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
